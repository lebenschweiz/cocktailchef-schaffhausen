<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lebenplus Familie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: Karopapier wie die ausgedruckte Liste, Namen mit Leuchtstift markiert; sticky Kopf mit Datum + Tabs, darunter Karten pro Person. */
:root {
  --paper: #fafaf6;
  --grid: rgba(46, 78, 150, .07);
  --card: #ffffff;
  --ink: #1d2540;
  --ink-2: #5d6683;
  --line: #e1e4ec;
  --hl: #f1e13a;
  --hl-ink: #2a2500;
  --pen: #2c57cf;
  --ok: #24935a;
  --warn: #c2482a;
  --shadow: 0 1px 2px rgba(29, 37, 64, .06), 0 6px 18px rgba(29, 37, 64, .06);
  --f-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121727; --grid: rgba(150, 175, 255, .055); --card: #1a2034; --ink: #eef0f8; --ink-2: #a2a9c3;
    --line: #2b3250; --hl: #e3d23a; --hl-ink: #1c1900; --pen: #92b2ff; --ok: #4cc884; --warn: #ff8a6b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121727; --grid: rgba(150, 175, 255, .055); --card: #1a2034; --ink: #eef0f8; --ink-2: #a2a9c3;
  --line: #2b3250; --hl: #e3d23a; --hl-ink: #1c1900; --pen: #92b2ff; --ok: #4cc884; --warn: #ff8a6b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  min-height: 100vh;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--pen); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: .005em; }
.num { font-variant-numeric: tabular-nums; }

/* Kopf */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 10px; }
.toprow { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1; display: flex; align-items: baseline; gap: 2px; }
.brand mark { background: linear-gradient(transparent 38%, var(--hl) 38%, var(--hl) 88%, transparent 88%); color: var(--hl-ink); padding: 0 3px; }
.datebar { display: flex; align-items: center; gap: 4px; }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.iconbtn svg { width: 18px; height: 18px; }
.datelabel { min-width: 0; text-align: center; padding: 0 8px; }
.datelabel b { display: block; font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; line-height: 1.15; }
.datelabel small { color: var(--ink-2); font-size: .78rem; }
.todaybtn { border: 0; background: none; color: var(--pen); font-weight: 600; font-size: .78rem; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
.tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { flex: 1 0 auto; border: 0; background: none; border-radius: 999px; padding: 8px 14px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tabs button svg { width: 17px; height: 17px; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--paper); }

main .wrap { padding-block: 20px 64px; display: flex; flex-direction: column; gap: 20px; }
.banner { border: 1px dashed var(--line); background: var(--card); border-radius: var(--r); padding: 10px 14px; color: var(--ink-2); font-size: .88rem; display: flex; gap: 10px; align-items: center; }
.banner svg { flex: none; width: 18px; height: 18px; color: var(--pen); }

/* Personen-Pillen */
.pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.pill { flex: none; display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 14px 5px 5px; font-weight: 600; }
.pill[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent); }
.pill .pts { color: var(--ink-2); font-weight: 500; font-size: .85rem; }
.ava { width: 30px; height: 30px; flex: none; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-weight: 600; font-size: .95rem; }
.ava.lg { width: 44px; height: 44px; font-size: 1.25rem; }

/* Tageskarten */
.daygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; align-items: start; }
.daycard { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.dayhead { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.dayhead .who { min-width: 0; flex: 1; }
.dayhead h2 { font-size: 1.3rem; display: inline; background: linear-gradient(transparent 45%, var(--hl) 45%, var(--hl) 92%, transparent 92%); padding: 0 4px; margin-left: -4px; color: var(--hl-ink); }
.dayhead .sub { color: var(--ink-2); font-size: .85rem; margin-top: 2px; }
.ring { position: relative; width: 62px; height: 62px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--c); transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; line-height: 1; }
.ring.done .val { color: var(--c); }
.tasks { list-style: none; margin: 0; padding: 0 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.task { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; padding: 9px 8px; border-radius: 10px; }
.task:hover:not(:disabled) { background: color-mix(in srgb, var(--c) 7%, transparent); }
.task:disabled { cursor: default; opacity: .6; }
.chk { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid color-mix(in srgb, var(--c) 55%, var(--line)); display: grid; place-items: center; transition: background .15s, border-color .15s, transform .15s; }
.chk svg { width: 16px; height: 16px; color: #fff; opacity: 0; transform: scale(.4); transition: opacity .15s, transform .2s cubic-bezier(.3,1.6,.5,1); }
.task.on .chk { background: var(--c); border-color: var(--c); }
.task.on .chk svg { opacity: 1; transform: none; }
.task.flash .chk { animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.18); } 100% { transform: none; } }
.task .t { flex: 1; min-width: 0; }
.task.on .t { color: var(--ink-2); }
.task .hint { display: block; font-size: .75rem; color: var(--ink-2); }
.badge { flex: none; font-weight: 700; font-size: .8rem; padding: 2px 9px; border-radius: 999px; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--ink); }
.task.on .badge { background: var(--c); color: #fff; }
.empty { padding: 22px 16px 26px; color: var(--ink-2); text-align: center; }
.empty .btn { margin-top: 10px; }
.goalbar { height: 4px; background: var(--line); }
.goalbar i { display: block; height: 100%; background: var(--c); transition: width .5s cubic-bezier(.2,.8,.2,1); }

/* Allgemein */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; min-width: 0; }
.panel h2 { font-size: 1.2rem; }
.panelhead { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.muted { color: var(--ink-2); }
.small { font-size: .85rem; }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 600; background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; gap: 6px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--warn); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.seg { display: inline-flex; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 8px; padding: 6px 12px; font-weight: 600; color: var(--ink-2); font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Rangliste */
.ranks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.rank { display: grid; grid-template-columns: 30px 44px 1fr auto; align-items: center; gap: 12px; }
.rank .pos { font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; color: var(--ink-2); text-align: center; }
.rank.first .pos { color: var(--ink); }
.rank .crown { display: block; margin: 0 auto -2px; width: 20px; height: 14px; color: #d9a400; }
.rank .info { min-width: 0; }
.rank .name { font-weight: 700; }
.rank .bar { height: 10px; border-radius: 999px; background: var(--line); margin: 5px 0 4px; overflow: hidden; }
.rank .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.rank .meta { font-size: .8rem; color: var(--ink-2); }
.rank .score { font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; line-height: 1; text-align: right; }
.rank .score small { display: block; font-family: var(--f-body); font-size: .72rem; font-weight: 500; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.stat .k { font-size: .72rem; color: var(--ink-2); letter-spacing: .05em; text-transform: uppercase; font-weight: 600; }
.stat .v { font-family: var(--f-display); font-size: 1.5rem; font-weight: 600; line-height: 1.2; }
.toplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.toplist li { display: flex; align-items: center; gap: 10px; }
.toplist .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.toplist .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toplist .n { color: var(--ink-2); font-size: .85rem; white-space: nowrap; }

/* Diagramm */
.chart { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 6px; }
.yax { position: relative; height: 180px; font-size: .72rem; color: var(--ink-2); }
.yax span { position: absolute; right: 0; transform: translateY(-50%); }
.plot { position: relative; height: 180px; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; border-bottom: 1.5px solid var(--ink-2); }
.plot .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
.plot .col { position: relative; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 1px; border-radius: 6px 6px 0 0; }
.plot .col.cur { background: color-mix(in srgb, var(--hl) 30%, transparent); }
.plot .b { flex: 1 1 0; max-width: 12px; min-width: 2px; background: var(--c); border-radius: 3px 3px 0 0; transition: height .5s cubic-bezier(.2,.8,.2,1); }
.xax { grid-column: 2; display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; font-size: .7rem; color: var(--ink-2); text-align: center; line-height: 1.2; }
.xax b { display: block; color: var(--ink); font-weight: 600; font-size: .75rem; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px; font-size: .85rem; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; background: var(--c); }

/* Wochenraster */
.tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.week { border-collapse: collapse; width: 100%; min-width: 560px; }
.week th, .week td { border: 1px solid var(--line); padding: 0; }
.week thead th { font-size: .78rem; font-weight: 600; color: var(--ink-2); padding: 6px 4px; text-align: center; }
.week thead th b { display: block; color: var(--ink); font-size: .95rem; }
.week th.cur, .week td.cur { background: color-mix(in srgb, var(--hl) 22%, transparent); }
.week .tt { text-align: left; padding: 7px 10px; font-weight: 500; font-size: .9rem; min-width: 190px; }
.week .tt span { color: var(--ink-2); font-size: .8rem; }
.week .namehead { text-align: left; padding: 6px 10px; }
.week .namehead mark { background: var(--hl); color: var(--hl-ink); padding: 1px 8px; font-family: var(--f-display); font-weight: 600; font-size: 1rem; border-radius: 3px; }
.cell { width: 100%; height: 36px; border: 0; background: none; display: grid; place-items: center; }
.cell:disabled { cursor: default; }
.cell i { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; transition: background .15s; }
.cell.on i { background: var(--c); border-color: var(--c); }
.cell.on i svg { width: 13px; height: 13px; color: #fff; }
.cell:hover:not(:disabled) i { border-color: var(--c); }
.week tfoot td { font-weight: 700; text-align: center; padding: 7px 4px; }
.week tfoot .tt { font-weight: 700; }

/* Aufgaben verwalten */
.editlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.editrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--card); }
.editrow .title { flex: 1 1 200px; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 7px 9px; }
.editrow .title:hover, .editrow .title:focus { border-color: var(--line); background: var(--paper); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.stepper button { border: 0; background: none; width: 32px; height: 32px; font-weight: 700; font-size: 1.05rem; }
.stepper button:hover { background: var(--paper); }
.stepper output { min-width: 50px; text-align: center; font-weight: 700; font-size: .88rem; }
.mini { border: 1px solid var(--line); background: none; border-radius: 8px; width: 32px; height: 32px; display: grid; place-items: center; flex: none; color: var(--ink-2); }
.mini svg { width: 16px; height: 16px; }
.mini:disabled { opacity: .3; cursor: default; }
.mini.del:hover, .mini.confirm { color: #fff; background: var(--warn); border-color: var(--warn); width: auto; padding: 0 10px; font-weight: 600; font-size: .8rem; }
.mini.del:hover { width: 32px; padding: 0; }
.addform { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.field { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 9px 12px; min-width: 0; }
.addform .field { flex: 1 1 220px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.sw { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--card); background: var(--c); box-shadow: 0 0 0 1px var(--line); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.memberrow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.memberrow .body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.memberrow .line { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.memberrow .line label { font-size: .82rem; color: var(--ink-2); font-weight: 600; }
textarea.field { width: 100%; min-height: 110px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .78rem; }
details summary { cursor: pointer; font-weight: 600; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; width: 100%; height: 100%; }
.loading { padding: 40px 0; text-align: center; color: var(--ink-2); }

@media (max-width: 759px) {
  .daygrid .daycard:not(.sel) { display: none; }
  .brand { font-size: 1.35rem; }
  .tabs { border-radius: 14px; }
  .tabs button { flex: 1 1 0; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: .74rem; border-radius: 10px; }
  .tabs button .lbl-long { display: none; }
}
@media (min-width: 760px) { .daypills { display: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="toprow">
      <div class="brand">Leben<mark>plus</mark></div>
      <div class="datebar">
        <button class="iconbtn" data-act="day" data-d="-1" aria-label="Vorheriger Tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div class="datelabel"><b id="dateMain">…</b><small id="dateSub"></small></div>
        <button class="iconbtn" id="nextDay" data-act="day" data-d="1" aria-label="Nächster Tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-act="tab" data-tab="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>Tag</button>
      <button role="tab" data-act="tab" data-tab="woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M9 4v17M15 4v17"/></svg>Woche</button>
      <button role="tab" data-act="tab" data-tab="rang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M10 20V6M16 20v-9M22 20H2"/></svg>Rangliste</button>
      <button role="tab" data-act="tab" data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Aufgaben<span class="lbl-long"> &amp; Familie</span></span></button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="view"><div class="loading">Lade eure Liste …</div></div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
"use strict";
const COLORS = ["#e4572e", "#1b998b", "#8e4fb5", "#2e6fdb", "#d99a00", "#4c9a2a", "#d6457c", "#56637a"];
const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const LSKEY = "lebenplus-v1", UIKEY = "lebenplus-ui";
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const weekStart = (s) => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };
const wdIdx = (s) => (parse(s).getDay() + 6) % 7;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pts = (n) => `${n} ${n === 1 ? "Punkt" : "Punkte"}`;

// ---------- Zustand ----------
const S = { members: new Map(), tasks: new Map(), days: new Map(), ready: false, mode: "loading", readOnly: false };
const UI = { tab: "tag", date: today(), member: null, period: "woche", confirm: null, flash: null };
try { Object.assign(UI, JSON.parse(localStorage.getItem(UIKEY) || "{}"), { date: today(), confirm: null, flash: null }); } catch {}
const saveUI = () => { try { localStorage.setItem(UIKEY, JSON.stringify({ tab: UI.tab, member: UI.member, period: UI.period })); } catch {} };

const members = () => [...S.members.entries()].map(([id, m]) => ({ id, ...m })).filter((m) => !m.archived)
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0) || String(a.name).localeCompare(b.name));
const tasksOf = (mid) => [...S.tasks.entries()].map(([id, t]) => ({ id, ...t })).filter((t) => t.memberId === mid && !t.archived)
  .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
const dayKey = (mid, date) => `${mid}_${date}`;
const doneOf = (mid, date) => S.days.get(dayKey(mid, date))?.done || {};
const sum = (o) => Object.values(o).reduce((a, v) => a + (Number(v) || 0), 0);
const total = (mid, date) => sum(doneOf(mid, date));
const curMember = () => { const ms = members(); return ms.find((m) => m.id === UI.member) || ms[0] || null; };
function daysOf(mid, from, to) {
  const out = [];
  for (const d of S.days.values()) if (d.memberId === mid && (!from || d.date >= from) && (!to || d.date <= to)) out.push(d);
  return out;
}

// ---------- Speicher ----------
let store = null;
const queues = new Map();
function queued(key, fn) {
  const p = (queues.get(key) || Promise.resolve()).then(fn, fn);
  queues.set(key, p.catch(() => {}));
  return p;
}
function writeFailed(e) {
  if (e && (e.code === "invalid_argument" || e.code === "not_granted")) {
    S.readOnly = true; toast("Du kannst diese Liste nur ansehen, nicht ändern."); render();
  } else if (e && e.code === "quota_exceeded") toast("Speicher voll. Alte Einträge löschen, dann klappt es wieder.");
  else toast("Speichern hat nicht geklappt. Bitte nochmal versuchen.");
}
function put(coll, id, data) {
  S[coll].set(id, data);
  return queued(coll + "/" + id, () => store.set(coll, id, data)).catch(writeFailed);
}

function localStore() {
  const load = () => {
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem(LSKEY) || "{}"); } catch {}
    for (const c of ["members", "tasks", "days"]) S[c] = new Map(Object.entries(raw[c] || {}));
  };
  const persist = () => {
    const o = {};
    for (const c of ["members", "tasks", "days"]) o[c] = Object.fromEntries(S[c]);
    try { localStorage.setItem(LSKEY, JSON.stringify(o)); } catch { toast("Dieser Browser speichert gerade nichts."); }
  };
  load();
  window.addEventListener("storage", (e) => { if (e.key === LSKEY) { load(); render(); } });
  return { set: async () => persist(), replaceAll: async () => persist() };
}

function dbStore(db) {
  const loaded = new Set();
  const sub = (name, q) => q.onSnapshot((snap) => {
    S[name] = new Map(snap.docs.map((d) => [d.id, d.data()]));
    loaded.add(name);
    if (loaded.size === 3) S.ready = true;
    render();
  }, (e) => { if (e && e.code === "unavailable") setTimeout(() => sub(name, q), 3000); else toast("Verbindung zur Liste unterbrochen."); });
  sub("members", db.collection("members"));
  sub("tasks", db.collection("tasks"));
  sub("days", db.collection("days").where("date", ">=", addDays(today(), -400)));
  return { set: (coll, id, data) => db.collection(coll).doc(id).set(data) };
}

async function boot() {
  let db = null, user = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch {}
  }
  if (db) {
    S.mode = "db";
    store = dbStore(db);
    try { if (user && (await user.can("data.write")) === false) S.readOnly = true; } catch {}
  } else {
    S.mode = "local";
    store = localStore();
    S.ready = true;
  }
  render();
}

// ---------- Aktionen ----------
function toggle(mid, tid, date) {
  if (S.readOnly || date > today()) return;
  const t = S.tasks.get(tid); if (!t) return;
  const key = dayKey(mid, date);
  const done = { ...doneOf(mid, date) };
  const before = sum(done);
  if (done[tid] != null) delete done[tid];
  else {
    if (t.group) for (const [otherId, o] of S.tasks) if (otherId !== tid && o.memberId === mid && o.group === t.group) delete done[otherId];
    done[tid] = Number(t.points) || 0;
    UI.flash = tid + "@" + date;
  }
  put("days", key, { memberId: mid, date, done });
  const m = S.members.get(mid);
  const goal = Number(m?.goal) || 0;
  if (goal && before < goal && sum(done) >= goal) { celebrate(m.color); toast(`${m.name} hat das Tagesziel geschafft!`); }
  render();
  UI.flash = null;
}

function reorder(mid, tid, dir) {
  const list = tasksOf(mid);
  const i = list.findIndex((t) => t.id === tid), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  [list[i], list[j]] = [list[j], list[i]];
  list.forEach((t, k) => { if (t.order !== k * 10) { const { id, ...rest } = t; put("tasks", id, { ...rest, order: k * 10 }); } });
  render();
}
function patch(coll, id, fields) {
  const cur = S[coll].get(id); if (!cur) return;
  put(coll, id, { ...cur, ...fields });
  render();
}

// ---------- Darstellung ----------
function ring(val, goal, color) {
  const r = 26, c = 2 * Math.PI * r, p = goal ? Math.min(1, val / goal) : 0;
  return `<div class="ring ${goal && val >= goal ? "done" : ""}" style="--c:${color}">
    <svg viewBox="0 0 62 62"><circle class="bg" cx="31" cy="31" r="${r}" fill="none" stroke-width="6"/>
    <circle class="fg" cx="31" cy="31" r="${r}" fill="none" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}"/></svg>
    <span class="val num">${val}</span></div>`;
}
const ava = (m, lg) => `<span class="ava ${lg ? "lg" : ""}" style="--c:${esc(m.color)}">${esc((m.name || "?").trim().charAt(0).toUpperCase())}</span>`;
const pills = (ms, cls, withPts) => `<div class="pills ${cls}">${ms.map((m) => `<button class="pill" style="--c:${esc(m.color)}" data-act="member" data-mid="${m.id}" aria-pressed="${m.id === curMember()?.id}">${ava(m)}${esc(m.name)}${withPts ? ` <span class="pts num">${total(m.id, UI.date)}</span>` : ""}</button>`).join("")}</div>`;

function banner() {
  if (S.readOnly) return `<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Nur ansehen: Für Häkchen braucht ihr Bearbeitungsrechte an dieser Liste.</div>`;
  if (S.mode === "local") return `<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>Die Liste wird auf diesem Gerät gespeichert. Am besten nutzt ihr ein gemeinsames Familien-Tablet. Sichern könnt ihr unter „Aufgaben“.</div>`;
  return "";
}

function welcome() {
  return `<div class="panel empty"><h2>Willkommen bei Lebenplus</h2><p>Legt zuerst eure Familie und eure Vorsätze an. Danach hakt ihr jeden Tag ab, was ihr geschafft habt.</p>
    ${S.readOnly ? "" : `<button class="btn" data-act="tab" data-tab="setup">Familie anlegen</button>`}</div>`;
}

function viewTag() {
  const ms = members(); if (!ms.length) return welcome();
  const sel = curMember(); const future = UI.date > today();
  const cards = ms.map((m) => {
    const ts = tasksOf(m.id), done = doneOf(m.id, UI.date), val = sum(done), goal = Number(m.goal) || 0;
    const left = goal - val;
    const sub = goal ? (left > 0 ? `Ziel ${goal} · noch ${left}` : `Ziel ${goal} geschafft`) : `${ts.filter((t) => done[t.id] != null).length} von ${ts.length} geschafft`;
    return `<article class="daycard ${m.id === sel.id ? "sel" : ""}" style="--c:${esc(m.color)}">
      <div class="dayhead">${ring(val, goal, esc(m.color))}<div class="who"><h2>${esc(m.name)}</h2><div class="sub num">${sub}</div></div></div>
      <div class="goalbar"><i style="width:${goal ? Math.min(100, (val / goal) * 100) : 0}%"></i></div>
      ${ts.length ? `<ul class="tasks">${ts.map((t) => {
        const on = done[t.id] != null;
        const hint = t.group ? `<span class="hint">entweder oder</span>` : "";
        return `<li><button class="task ${on ? "on" : ""} ${UI.flash === t.id + "@" + UI.date ? "flash" : ""}" data-act="toggle" data-mid="${m.id}" data-tid="${t.id}" data-date="${UI.date}" aria-pressed="${on}" ${S.readOnly || future ? "disabled" : ""}>
          <span class="chk">${ICON_CHECK}</span><span class="t">${esc(t.title)}${hint}</span><span class="badge num">+${Number(t.points) || 0}</span></button></li>`;
      }).join("")}</ul>` : `<div class="empty small">Noch keine Vorsätze.${S.readOnly ? "" : ` <br><button class="btn ghost" data-act="tab" data-tab="setup">Vorsatz anlegen</button>`}</div>`}
    </article>`;
  }).join("");
  return `${pills(ms, "daypills", true)}${future ? `<div class="banner">Dieser Tag liegt in der Zukunft. Abhaken geht erst, wenn er da ist.</div>` : ""}<div class="daygrid">${cards}</div>`;
}

function viewWoche() {
  const ms = members(); if (!ms.length) return welcome();
  const m = curMember(), ts = tasksOf(m.id), ws = weekStart(UI.date);
  const dates = [...Array(7)].map((_, i) => addDays(ws, i)), td = today();
  const head = dates.map((d) => `<th class="${d === td ? "cur" : ""}">${WD[wdIdx(d)]}<b class="num">${parse(d).getDate()}</b></th>`).join("");
  const rows = ts.map((t) => `<tr><th class="tt" scope="row">${esc(t.title)} <span class="num">(${Number(t.points) || 0})</span></th>${dates.map((d) => {
    const on = doneOf(m.id, d)[t.id] != null;
    return `<td class="${d === td ? "cur" : ""}"><button class="cell ${on ? "on" : ""}" data-act="toggle" data-mid="${m.id}" data-tid="${t.id}" data-date="${d}" aria-label="${esc(t.title)}, ${WD[wdIdx(d)]} ${parse(d).getDate()}." aria-pressed="${on}" ${S.readOnly || d > td ? "disabled" : ""}><i>${on ? ICON_CHECK : ""}</i></button></td>`;
  }).join("")}</tr>`).join("");
  const sums = dates.map((d) => total(m.id, d)), wk = sums.reduce((a, b) => a + b, 0);
  const range = `${parse(dates[0]).toLocaleDateString("de-CH", { day: "numeric", month: "short" })} bis ${parse(dates[6]).toLocaleDateString("de-CH", { day: "numeric", month: "short" })}`;
  return `${pills(ms, "", false)}
  <section class="panel" style="--c:${esc(m.color)}">
    <div class="panelhead"><div><h2>Wochenliste</h2><div class="muted small">${range} · tippe ein Feld zum Abhaken</div></div>
      <div class="seg"><button data-act="week" data-d="-7">Vorwoche</button><button data-act="week" data-d="7" ${addDays(ws, 7) > td ? "disabled" : ""}>Nächste</button></div></div>
    ${ts.length ? `<div class="tablewrap"><table class="week">
      <thead><tr><th class="namehead"><mark>${esc(m.name)}</mark></th>${head}</tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="tt">Punkte · Woche <span class="num">${wk}</span></td>${sums.map((s, i) => `<td class="num ${dates[i] === td ? "cur" : ""}">${s || "–"}</td>`).join("")}</tr></tfoot>
    </table></div>` : `<div class="empty">${esc(m.name)} hat noch keine Vorsätze.</div>`}
  </section>`;
}

function periodRange() {
  const d = UI.date;
  if (UI.period === "tag") return [d, d, parse(d).toLocaleDateString("de-CH", { weekday: "long", day: "numeric", month: "long" })];
  if (UI.period === "woche") { const s = weekStart(d), e = addDays(s, 6); return [s, e, `Woche ${parse(s).getDate()}.${parse(s).getMonth() + 1}. bis ${parse(e).getDate()}.${parse(e).getMonth() + 1}.`]; }
  if (UI.period === "monat") { const x = parse(d); const s = ymd(new Date(x.getFullYear(), x.getMonth(), 1)), e = ymd(new Date(x.getFullYear(), x.getMonth() + 1, 0)); return [s, e, x.toLocaleDateString("de-CH", { month: "long", year: "numeric" })]; }
  return [null, null, "Seit Beginn"];
}
function streak(m) {
  const goal = Number(m.goal) || 1; let d = today(), n = 0;
  if (total(m.id, d) < goal) d = addDays(d, -1);
  while (total(m.id, d) >= goal && n < 400) { n++; d = addDays(d, -1); }
  return n;
}

function viewRang() {
  const ms = members(); if (!ms.length) return welcome();
  const [from, to, label] = periodRange();
  const rows = ms.map((m) => {
    const ds = daysOf(m.id, from, to), p = ds.reduce((a, d) => a + sum(d.done || {}), 0);
    const active = ds.filter((d) => sum(d.done || {}) > 0).length;
    const goalDays = ds.filter((d) => sum(d.done || {}) >= (Number(m.goal) || Infinity)).length;
    return { m, p, active, goalDays, avg: active ? p / active : 0, streak: streak(m) };
  }).sort((a, b) => b.p - a.p);
  const max = Math.max(1, ...rows.map((r) => r.p));
  const crown = '<svg class="crown" viewBox="0 0 20 14" fill="currentColor"><path d="M1 3l4.5 4L10 0l4.5 7L19 3l-2 11H3z"/></svg>';
  const list = rows.map((r, i) => {
    const pos = i === 0 || r.p !== rows[i - 1].p ? i + 1 : rows.findIndex((x) => x.p === r.p) + 1;
    return `<li class="rank ${pos === 1 && r.p > 0 ? "first" : ""}" style="--c:${esc(r.m.color)}">
      <div class="pos">${pos === 1 && r.p > 0 ? crown : ""}${pos}.</div>${ava(r.m, true)}
      <div class="info"><div class="name">${esc(r.m.name)}</div><div class="bar"><i style="width:${(r.p / max) * 100}%"></i></div>
      <div class="meta num">${UI.period === "tag" ? (r.m.goal ? `Ziel ${r.m.goal}` : "") : `Ø ${r.avg.toFixed(1)} pro Tag · Ziel an ${r.goalDays} ${r.goalDays === 1 ? "Tag" : "Tagen"}`} · Serie ${r.streak} ${r.streak === 1 ? "Tag" : "Tage"}</div></div>
      <div class="score num">${r.p}<small>Punkte</small></div></li>`;
  }).join("");

  // Diagramm: 14 Tage bis zum gewählten Datum
  const days = [...Array(14)].map((_, i) => addDays(UI.date, i - 13));
  const vals = days.map((d) => ms.map((m) => total(m.id, d)));
  const top = Math.max(4, ...vals.flat()), step = top <= 10 ? 2 : top <= 20 ? 5 : 10, ymax = Math.ceil(top / step) * step;
  const ticks = [0, ymax / 2, ymax];
  const chart = `<div class="chart">
    <div class="yax num">${ticks.map((t) => `<span style="top:${100 - (t / ymax) * 100}%">${t}</span>`).join("")}</div>
    <div class="plot">${ticks.slice(1).map((t) => `<div class="gl" style="top:${100 - (t / ymax) * 100}%"></div>`).join("")}
      ${days.map((d, i) => `<div class="col ${d === UI.date ? "cur" : ""}" title="${parse(d).toLocaleDateString("de-CH")}: ${ms.map((m, j) => `${m.name} ${vals[i][j]}`).join(", ")}">${ms.map((m, j) => `<div class="b" style="--c:${esc(m.color)};height:${(vals[i][j] / ymax) * 100}%"></div>`).join("")}</div>`).join("")}</div>
    <div class="xax num">${days.map((d) => `<span>${WD[wdIdx(d)].charAt(0)}<b>${parse(d).getDate()}</b></span>`).join("")}</div>
  </div><div class="legend">${ms.map((m) => `<span style="--c:${esc(m.color)}"><i></i>${esc(m.name)}</span>`).join("")}</div>`;

  // Häufigste Vorsätze im Zeitraum
  const counts = new Map();
  for (const m of ms) for (const d of daysOf(m.id, from, to)) for (const tid of Object.keys(d.done || {})) counts.set(tid, (counts.get(tid) || 0) + 1);
  const topTasks = [...counts.entries()].filter(([id]) => S.tasks.has(id)).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const fam = rows.reduce((a, r) => a + r.p, 0);

  return `<section class="panel">
    <div class="panelhead"><div><h2>Wer hat wie viele Punkte?</h2><div class="muted small">${esc(label)}</div></div>
      <div class="seg">${[["tag", "Tag"], ["woche", "Woche"], ["monat", "Monat"], ["alle", "Gesamt"]].map(([k, l]) => `<button data-act="period" data-p="${k}" aria-pressed="${UI.period === k}">${l}</button>`).join("")}</div></div>
    <ol class="ranks">${list}</ol>
  </section>
  <div class="cols2">
    <section class="panel"><div class="panelhead"><div><h2>Letzte 14 Tage</h2><div class="muted small">Punkte pro Tag und Person</div></div></div>${chart}</section>
    <section class="panel"><div class="panelhead"><h2>Familie gesamt</h2></div>
      <div class="stats">
        <div class="stat"><div class="k">Punkte zusammen</div><div class="v num">${fam}</div></div>
        <div class="stat"><div class="k">Häkchen gesetzt</div><div class="v num">${[...counts.values()].reduce((a, b) => a + b, 0)}</div></div>
      </div>
      <h3 style="font-size:1rem;margin:18px 0 10px">Am häufigsten geschafft</h3>
      ${topTasks.length ? `<ul class="toplist">${topTasks.map(([id, n]) => { const t = S.tasks.get(id), m = S.members.get(t.memberId); return `<li style="--c:${esc(m?.color || "#888")}"><span class="dot"></span><span class="t">${esc(t.title)} <span class="muted small">· ${esc(m?.name || "")}</span></span><span class="n num">${n}×</span></li>`; }).join("")}</ul>` : `<p class="muted small">In diesem Zeitraum wurde noch nichts abgehakt.</p>`}
    </section>
  </div>`;
}

function viewSetup() {
  const ms = members(), m = curMember(), ro = S.readOnly ? "disabled" : "";
  const del = (key, act, attrs) => UI.confirm === key
    ? `<button class="mini confirm" data-act="${act}" ${attrs} ${ro}>Wirklich löschen</button>`
    : `<button class="mini del" data-act="ask" data-key="${key}" aria-label="Löschen" ${ro}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`;
  let tasksPanel = "";
  if (m) {
    const ts = tasksOf(m.id);
    tasksPanel = `<section class="panel" style="--c:${esc(m.color)}">
      <div class="panelhead"><div><h2>Vorsätze von ${esc(m.name)}</h2><div class="muted small">Titel antippen zum Ändern. Mit + und − legt ihr die Punkte fest.</div></div></div>
      ${pills(ms, "", false)}
      <ul class="editlist" style="margin-top:14px">${ts.map((t, i) => `<li class="editrow">
        <input class="title" id="t-${t.id}" value="${esc(t.title)}" data-field="title" data-tid="${t.id}" aria-label="Titel" ${ro}>
        <span class="stepper"><button data-act="pts" data-tid="${t.id}" data-d="-1" aria-label="Weniger Punkte" ${ro}>−</button><output class="num">${pts(Number(t.points) || 0)}</output><button data-act="pts" data-tid="${t.id}" data-d="1" aria-label="Mehr Punkte" ${ro}>+</button></span>
        <button class="mini" data-act="move" data-tid="${t.id}" data-d="-1" aria-label="Nach oben" ${i === 0 || ro ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></button>
        <button class="mini" data-act="move" data-tid="${t.id}" data-d="1" aria-label="Nach unten" ${i === ts.length - 1 || ro ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        ${del("t:" + t.id, "deltask", `data-tid="${t.id}"`)}
      </li>`).join("") || `<li class="muted small">Noch keine Vorsätze. Legt unten den ersten an.</li>`}</ul>
      <form class="addform" data-form="task"><input class="field" id="newTask" name="title" placeholder="Neuer Vorsatz, z. B. Zähne putzen ohne Erinnern" autocomplete="off" required ${ro}>
        <span class="stepper"><button type="button" data-act="newpts" data-d="-1" aria-label="Weniger Punkte" ${ro}>−</button><output class="num" id="newPts">${pts(UI.newPts ?? 1)}</output><button type="button" data-act="newpts" data-d="1" aria-label="Mehr Punkte" ${ro}>+</button></span>
        <button class="btn" ${ro}>Hinzufügen</button></form>
    </section>`;
  }
  const famPanel = `<section class="panel"><div class="panelhead"><div><h2>Familie</h2><div class="muted small">Das Tagesziel bestimmt, wann der Ring voll ist.</div></div></div>
    <div style="display:flex;flex-direction:column;gap:10px">${ms.map((x) => `<div class="memberrow">${ava(x, true)}<div class="body">
      <div class="line"><input class="field" id="m-${x.id}" value="${esc(x.name)}" data-field="name" data-mid="${x.id}" aria-label="Name" style="flex:1 1 160px" ${ro}>
        <span class="stepper"><button data-act="goal" data-mid="${x.id}" data-d="-1" aria-label="Ziel senken" ${ro}>−</button><output class="num">Ziel ${Number(x.goal) || 0}</output><button data-act="goal" data-mid="${x.id}" data-d="1" aria-label="Ziel erhöhen" ${ro}>+</button></span>
        ${del("m:" + x.id, "delmember", `data-mid="${x.id}"`)}</div>
      <div class="swatches">${COLORS.map((c) => `<button class="sw" style="--c:${c}" data-act="color" data-mid="${x.id}" data-c="${c}" aria-label="Farbe ${c}" aria-pressed="${x.color === c}" ${ro}></button>`).join("")}</div>
    </div></div>`).join("")}</div>
    <form class="addform" data-form="member"><input class="field" id="newMember" name="name" placeholder="Name, z. B. Oma" autocomplete="off" required ${ro}><button class="btn" ${ro}>Person hinzufügen</button></form>
  </section>`;
  const exp = JSON.stringify({ members: Object.fromEntries(S.members), tasks: Object.fromEntries(S.tasks), days: Object.fromEntries(S.days) });
  const dataPanel = `<section class="panel"><details><summary>Daten sichern${S.mode === "local" ? " und wiederherstellen" : ""}</summary>
    <p class="muted small">Kopiert diesen Text und bewahrt ihn auf, z. B. in einer Notiz.</p>
    <textarea class="field" id="exportBox" readonly>${esc(exp)}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn ghost" data-act="copy">Kopieren</button></div>
    ${S.mode === "local" ? `<p class="muted small" style="margin-top:16px">Gesicherten Text hier einfügen, um ihn zurückzuholen. Das ersetzt alles auf diesem Gerät.</p>
    <textarea class="field" id="importBox" placeholder='{"members":…}'></textarea>
    <div style="margin-top:8px">${UI.confirm === "import" ? `<button class="btn danger" data-act="import">Ja, alles ersetzen</button>` : `<button class="btn ghost" data-act="ask" data-key="import">Wiederherstellen</button>`}</div>` : ""}
  </details></section>`;
  return (m ? tasksPanel : "") + famPanel + dataPanel;
}

function render() {
  const td = today(), d = parse(UI.date);
  $("#dateMain").textContent = UI.date === td ? "Heute" : UI.date === addDays(td, -1) ? "Gestern" : d.toLocaleDateString("de-CH", { weekday: "long" });
  $("#dateSub").innerHTML = esc(d.toLocaleDateString("de-CH", { day: "numeric", month: "long", year: "numeric" })) + (UI.date !== td ? ` · <button class="todaybtn" data-act="today">zu heute</button>` : "");
  $("#nextDay").disabled = UI.date >= td;
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === UI.tab)));
  if (!S.ready) return;
  const active = document.activeElement, focusId = active && active.id, selStart = active && active.selectionStart;
  const views = { tag: viewTag, woche: viewWoche, rang: viewRang, setup: viewSetup };
  $("#view").innerHTML = banner() + (views[UI.tab] || viewTag)();
  if (focusId && focusId !== "exportBox") { const el = document.getElementById(focusId); if (el && el !== active) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
}

// ---------- Ereignisse ----------
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const a = b.dataset.act, ds = b.dataset;
  if (a !== "ask" && a !== "deltask" && a !== "delmember" && a !== "import") UI.confirm = null;
  switch (a) {
    case "tab": UI.tab = ds.tab; saveUI(); render(); window.scrollTo({ top: 0 }); break;
    case "day": UI.date = addDays(UI.date, Number(ds.d)); if (UI.date > today()) UI.date = today(); render(); break;
    case "week": UI.date = addDays(UI.date, Number(ds.d)); if (UI.date > today()) UI.date = today(); render(); break;
    case "today": UI.date = today(); render(); break;
    case "member": UI.member = ds.mid; saveUI(); render(); break;
    case "period": UI.period = ds.p; saveUI(); render(); break;
    case "toggle": toggle(ds.mid, ds.tid, ds.date); break;
    case "pts": { const t = S.tasks.get(ds.tid); if (t) patch("tasks", ds.tid, { points: Math.max(0, Math.min(20, (Number(t.points) || 0) + Number(ds.d))) }); break; }
    case "newpts": UI.newPts = Math.max(0, Math.min(20, (UI.newPts ?? 1) + Number(ds.d))); $("#newPts").textContent = pts(UI.newPts); break;
    case "move": { const t = S.tasks.get(ds.tid); if (t) reorder(t.memberId, ds.tid, Number(ds.d)); break; }
    case "goal": { const m = S.members.get(ds.mid); if (m) patch("members", ds.mid, { goal: Math.max(0, Math.min(99, (Number(m.goal) || 0) + Number(ds.d))) }); break; }
    case "color": patch("members", ds.mid, { color: ds.c }); break;
    case "ask": UI.confirm = UI.confirm === ds.key ? null : ds.key; render(); break;
    case "deltask": UI.confirm = null; patch("tasks", ds.tid, { archived: true }); toast("Vorsatz gelöscht. Bisherige Punkte bleiben erhalten."); break;
    case "delmember": UI.confirm = null; patch("members", ds.mid, { archived: true }); if (UI.member === ds.mid) UI.member = null; render(); toast("Person entfernt."); break;
    case "copy": {
      const box = $("#exportBox");
      const fallback = () => { box.focus(); box.select(); toast("Text markiert. Jetzt kopieren."); };
      try { navigator.clipboard.writeText(box.value).then(() => toast("Kopiert."), fallback); } catch { fallback(); }
      break;
    }
    case "import": {
      UI.confirm = null;
      try {
        const o = JSON.parse($("#importBox").value);
        if (!o || typeof o !== "object" || !o.members) throw 0;
        for (const c of ["members", "tasks", "days"]) S[c] = new Map(Object.entries(o[c] || {}));
        store.replaceAll(); toast("Daten wiederhergestellt."); render();
      } catch { toast("Das sieht nicht nach gesicherten Lebenplus-Daten aus."); render(); }
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  const el = e.target, v = el.value.trim();
  if (el.dataset.field === "title" && v) patch("tasks", el.dataset.tid, { title: v });
  if (el.dataset.field === "name" && v) patch("members", el.dataset.mid, { name: v });
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  if (S.readOnly) return;
  const f = e.target;
  if (f.dataset.form === "task") {
    const title = f.elements.title.value.trim(), m = curMember(); if (!title || !m) return;
    const ts = tasksOf(m.id);
    put("tasks", "t" + uid(), { memberId: m.id, title, points: UI.newPts ?? 1, order: ts.length ? (ts[ts.length - 1].order ?? 0) + 10 : 0, archived: false });
    f.elements.title.value = ""; toast("Vorsatz angelegt."); render();
    $("#newTask")?.focus();
  }
  if (f.dataset.form === "member") {
    const name = f.elements.name.value.trim(); if (!name) return;
    const ms = members(), used = new Set(ms.map((m) => m.color));
    const id = "m" + uid();
    put("members", id, { name, color: COLORS.find((c) => !used.has(c)) || COLORS[ms.length % COLORS.length], goal: 10, order: ms.length ? (ms[ms.length - 1].order ?? 0) + 10 : 0, archived: false });
    UI.member = id; saveUI(); f.elements.name.value = ""; toast(`${name} ist dabei.`); render();
  }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && UI.date > today()) { UI.date = today(); render(); } });

// ---------- Kleinigkeiten ----------
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600); }
function celebrate(color) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = [color, "#f1e13a", "#ffffff", color];
  const ps = [...Array(90)].map(() => ({ x: innerWidth / 2, y: innerHeight * 0.35, vx: (Math.random() - .5) * 12, vy: Math.random() * -11 - 3, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .32; p.x += p.vx; p.y += p.vy; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
    if (t - t0 < 1800) requestAnimationFrame(frame); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}

render();
boot();
})();
</script>

</body>
